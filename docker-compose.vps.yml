# Varian deployment untuk VPS yang SUDAH punya Nginx host + Certbot/Let's Encrypt.
# Pakai: docker compose -f docker-compose.vps.yml --env-file .env.prod up -d --build
#
# - Tidak ada container Certbot (SSL dikelola Nginx host).
# - Tidak ada container MongoDB (produksi memakai MongoDB Atlas via MONGO_URL).
# - Tidak ada bind ke port 80/443. Frontend hanya di 127.0.0.1:8080.
# - FastAPI & MongoDB tidak pernah terekspos ke internet.
services:
  api:
    build: ./backend
    container_name: danatalang-api
    restart: unless-stopped
    expose:
      - "8001"
    environment:
      MONGO_URL: ${MONGO_URL}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      SUPERADMIN_NAME: ${SUPERADMIN_NAME}
      SUPERADMIN_PHONE: ${SUPERADMIN_PHONE}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD}
      SUPERADMIN_RECOVERY: ${SUPERADMIN_RECOVERY:-}
      REQUIRE_S3: ${REQUIRE_S3:-true}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_REGION: ${S3_REGION:-auto}
      S3_PREFIX: ${S3_PREFIX:-danatalang}

  web:
    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: https://${DOMAIN}
    container_name: danatalang-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./deploy/nginx.internal.conf:/etc/nginx/conf.d/default.conf:ro
