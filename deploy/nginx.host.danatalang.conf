# Contoh konfigurasi untuk Nginx HOST VPS (bukan di dalam container).
# Simpan sebagai /etc/nginx/sites-available/danatalang.id lalu symlink ke sites-enabled.
# SSL dikelola Certbot host: `certbot --nginx -d danatalang.id -d www.danatalang.id`
# (Certbot akan menambahkan/menyesuaikan blok listen 443 + sertifikat secara otomatis.)

server {
    listen 80;
    listen [::]:80;
    server_name danatalang.id www.danatalang.id;

    # Dibiarkan agar Certbot (webroot/nginx plugin) bisa memverifikasi.
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / { return 301 https://danatalang.id$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name danatalang.id www.danatalang.id;

    # Diisi/di-update oleh Certbot host:
    ssl_certificate     /etc/letsencrypt/live/danatalang.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/danatalang.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 8m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /sw.js {
        proxy_pass http://127.0.0.1:8080/sw.js;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache";
    }
}
