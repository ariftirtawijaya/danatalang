server {
    listen 80;
    server_name ${DOMAIN};
    client_max_body_size 8m;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    # Sebelum SSL aktif, situs dilayani lewat HTTP.
    # Setelah sertifikat terpasang, hapus penanda SSL_START/SSL_END (lihat DEPLOYMENT.md langkah E)
    # agar seluruh trafik HTTP dialihkan ke HTTPS.
    # SSL_START return 301 https://$host$request_uri; # SSL_END

    location /api/ {
        proxy_pass http://api:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    location = /sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }
}

# SSL_START
server {
    listen 443 ssl;
    http2 on;
    server_name ${DOMAIN};
    client_max_body_size 8m;

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://api:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    location = /sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }
}
# SSL_END
