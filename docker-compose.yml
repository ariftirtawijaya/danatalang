services:
  # MongoDB lokal = OPSIONAL (development / VPS tanpa Atlas).
  # Jalankan dengan: docker compose --profile localdb up -d
  # Produksi disarankan memakai MongoDB Atlas lewat MONGO_URL (mongodb+srv://...).
  mongo:
    image: mongo:7
    profiles: ["localdb"]
    container_name: danatalang-mongo
    restart: unless-stopped
    command: ["--bind_ip", "0.0.0.0"]
    volumes:
      - mongo_data:/data/db
    # Tidak ada "ports:" — MongoDB hanya dapat diakses dari jaringan internal compose.

  api:
    build: ./backend
    container_name: danatalang-api
    restart: unless-stopped
    environment:
      MONGO_URL: ${MONGO_URL}
      REQUIRE_S3: ${REQUIRE_S3:-}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      SUPERADMIN_NAME: ${SUPERADMIN_NAME}
      SUPERADMIN_PHONE: ${SUPERADMIN_PHONE}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD}
      SUPERADMIN_RECOVERY: ${SUPERADMIN_RECOVERY:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_REGION: ${S3_REGION:-auto}
      S3_PREFIX: ${S3_PREFIX:-danatalang}

  web:
    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: https://${DOMAIN}
    container_name: danatalang-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot

  certbot:
    image: certbot/certbot
    container_name: danatalang-certbot
    profiles: ["tools"]
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot

volumes:
  mongo_data:
  certbot_conf:
  certbot_www:
